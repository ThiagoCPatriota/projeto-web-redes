<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Simulação visual do modelo OSI com requisições de rede — HTTP, SMTP, FTP e WebSocket">
    <title>Redes | OSI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Bungee&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="./src/css/global.css">
    <link rel="stylesheet" href="./src/css/reset.css">
    <link rel="stylesheet" href="./src/css/header.css">
    <link rel="stylesheet" href="./src/css/main.css">
    <link rel="stylesheet" href="./src/css/result.css">
    <link rel="stylesheet" href="./src/css/form.css">
    <link rel="stylesheet" href="./src/css/osi-layers.css">
</head>

<body>

    <header class="header">
        <img class="logo" src="./assets/osi.jpg" alt="Logo OSI">
        <p class="header-title">Projeto - Modelo OSI</p>
        <p class="info header-user" id="user"></p>
    </header>

    <main class="main">
        <div class="pedido">
            <button class="btn main-button" id="btn">Enviar</button>
            <input type="text" class="input main-input" id="input" placeholder="Digite algo...">
            <input type="file" class="file-input main-file-input" id="fileInput">
        </div>
        <p class="result main-result-protocol" id="result">HTTP</p>
    </main>

    <section class="section">
        <form method="post" class="section-form"></form>
    </section>

    <div id="osi-layers-container" class="osi-container"></div>

    <script type="module" src="./src/script/script.js"></script>
</body>

</html>
